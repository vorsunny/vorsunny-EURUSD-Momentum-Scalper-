name: Repository and TradingView checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check standalone Pine helper sync
        run: python3 Tools/build_tradingview.py --check
      - name: Repository sanity checks (not Pine compilation)
        run: python3 Tests/static_checks.py
      - name: Release tooling and alert log tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Guard stable release tags
        if: startsWith(github.ref, 'refs/tags/tradingview-v') && !contains(github.ref, '-rc.')
        run: python3 Tools/package_tradingview.py --check-stable
      - name: Package validation-pending candidate
        run: python3 Tools/package_tradingview.py
      - uses: actions/upload-artifact@v4
        with:
          name: tradingview-candidate-native-validation-pending
          path: dist/*
